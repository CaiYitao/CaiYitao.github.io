      <rect x="124" y="148" width="24" height="24" rx="3" fill="#fca5a5"/><rect x="152" y="148" width="24" height="24" rx="3" fill="#ef4444" stroke="#7c3aed" stroke-width="3"/><rect x="180" y="148" width="24" height="24" rx="3" fill="#ef4444" stroke="#7c3aed" stroke-width="3"/><rect x="208" y="148" width="24" height="24" rx="3" fill="#fca5a5"/><rect x="236" y="148" width="24" height="24" rx="3" fill="#f87171"/><rect x="264" y="148" width="24" height="24" rx="3" fill="#fca5a5"/><rect x="292" y="148" width="24" height="24" rx="3" fill="#fecaca"/>
