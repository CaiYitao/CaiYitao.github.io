<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="whole-slide image attention grid">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1eefe"/><stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bgT)"/>
  <!-- patch grid with a red high-attention region; purple outlines mark Top-K patches -->
  <g shape-rendering="crispEdges">
