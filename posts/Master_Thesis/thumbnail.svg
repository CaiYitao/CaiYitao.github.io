    <g fill="#d7def0">
      <rect x="40" y="120" width="24" height="24" rx="3"/><rect x="68" y="120" width="24" height="24" rx="3"/><rect x="96" y="120" width="24" height="24" rx="3"/><rect x="124" y="120" width="24" height="24" rx="3"/>
