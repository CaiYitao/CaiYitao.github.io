      <rect x="40" y="204" width="24" height="24" rx="3"/><rect x="68" y="204" width="24" height="24" rx="3"/><rect x="96" y="204" width="24" height="24" rx="3"/><rect x="124" y="204" width="24" height="24" rx="3"/><rect x="152" y="204" width="24" height="24" rx="3"/>
      <rect x="348" y="204" width="24" height="24" rx="3"/><rect x="376" y="204" width="24" height="24" rx="3"/><rect x="404" y="204" width="24" height="24" rx="3"/>
